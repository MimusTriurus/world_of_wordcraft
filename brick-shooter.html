<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brick Shooter — стрелялка из Brick Game</title>
<style>
  :root {
    --lcd-bg: #9ead86;
    --lcd-on: #2b3122;
    --lcd-off: rgba(43, 49, 34, 0.12);
    --case: #f0c419;
    --case-dark: #c99f10;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2e;
    font-family: "Courier New", monospace;
    color: #2b3122;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .console {
    background: linear-gradient(160deg, var(--case), var(--case-dark));
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .screen {
    background: var(--lcd-bg);
    border: 4px solid #7c8a66;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    gap: 8px;
  }
  canvas { display: block; image-rendering: pixelated; }
  .hud {
    width: 92px;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 1px;
  }
  .hud .label { opacity: .65; }
  .hud .value { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  .hud .msg { margin-top: 10px; font-size: 11px; min-height: 40px; }
  .keys {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(2, 42px); gap: 4px; }
  button.k {
    background: #3a3a3f;
    color: #eee;
    border: none;
    border-radius: 8px;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1d1d20;
  }
  button.k:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d1d20; }
  .fire { width: 76px; height: 76px; border-radius: 50%; background: #d0342c; box-shadow: 0 4px 0 #8e211c; font-size: 13px; }
  .small { display: flex; gap: 6px; margin-top: 8px; }
  .small button.k { padding: 6px 10px; font-size: 11px; }
  .hint { text-align: center; color: #8a7a2a; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div class="console">
  <div class="screen">
    <canvas id="lcd"></canvas>
    <div class="hud">
      <div class="label">SCORE</div><div class="value" id="score">0</div>
      <div class="label">LEVEL</div><div class="value" id="level">1</div>
      <div class="label">LIVES</div><div class="value" id="lives">3</div>
      <div class="msg" id="msg">← → двигать<br>SPACE — огонь</div>
    </div>
  </div>
  <div class="keys">
    <div class="dpad">
      <button class="k" data-act="left">◀</button>
      <button class="k" data-act="fire">▲</button>
      <button class="k" data-act="right">▶</button>
      <button class="k" data-act="pause">P</button>
      <button class="k" data-act="fire">▲</button>
      <button class="k" data-act="reset">R</button>
    </div>
    <button class="k fire" data-act="fire">FIRE</button>
  </div>
  <div class="hint">← → · SPACE — огонь · P — пауза · R — заново</div>
</div>

<script>
(() => {
  "use strict";

  // ---- поле в клетках, как на настоящем LCD ----
  const COLS = 10, ROWS = 20;
  const CELL = 22, PAD = 2;

  const canvas = document.getElementById("lcd");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = COLS * CELL * dpr;
  canvas.height = ROWS * CELL * dpr;
  canvas.style.width  = COLS * CELL + "px";
  canvas.style.height = ROWS * CELL + "px";
  ctx.scale(dpr, dpr);

  const el = {
    score: document.getElementById("score"),
    level: document.getElementById("level"),
    lives: document.getElementById("lives"),
    msg:   document.getElementById("msg"),
  };

  const CANNON_ROW = ROWS - 1;

  let grid, bullets, cannonX, score, level, lives, killed;
  let dropInterval, dropTimer, bulletTimer, state;

  function emptyGrid() {
    return Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  }

  function newGame() {
    grid = emptyGrid();
    bullets = [];
    cannonX = COLS >> 1;
    score = 0; level = 1; lives = 3; killed = 0;
    dropInterval = 900;
    dropTimer = 0; bulletTimer = 0;
    state = "play";
    // стартовая стена
    for (let i = 0; i < 4; i++) spawnRow(i);
    setMsg("← → двигать<br>SPACE — огонь");
    syncHud();
  }

  // новая строка кирпичей сверху: случайный узор, минимум одна дырка
  function randomRow() {
    const row = new Array(COLS).fill(0);
    const density = Math.min(0.45 + level * 0.04, 0.8);
    let filled = 0;
    for (let x = 0; x < COLS; x++) {
      if (Math.random() < density) { row[x] = 1; filled++; }
    }
    if (filled === 0) row[(Math.random() * COLS) | 0] = 1;
    if (filled === COLS) row[(Math.random() * COLS) | 0] = 0;
    return row;
  }

  function spawnRow(atRow) {
    grid[atRow] = randomRow();
  }

  // сдвиг всей стены вниз на одну клетку
  function dropWall() {
    const bottom = grid[ROWS - 1];
    for (let x = 0; x < COLS; x++) {
      if (bottom[x]) { loseLife(); return; }
    }
    for (let y = ROWS - 1; y > 0; y--) grid[y] = grid[y - 1];
    grid[0] = randomRow();

    // кирпич, доехавший до строки пушки, — тоже проигрыш
    for (let x = 0; x < COLS; x++) {
      if (grid[CANNON_ROW][x]) { loseLife(); return; }
    }
  }

  function loseLife() {
    lives--;
    bullets = [];
    if (lives <= 0) {
      state = "over";
      setMsg("GAME OVER<br>R — заново");
    } else {
      // отодвигаем стену вверх, даём передышку
      const rows = grid.slice(0, ROWS - 5);
      grid = emptyGrid();
      for (let i = 0; i < rows.length && i + 5 < ROWS; i++) grid[i + 5] = rows[i];
      setMsg("Осталось<br>жизней: " + lives);
    }
    syncHud();
  }

  function fire() {
    if (state !== "play") return;
    if (bullets.length >= 3) return;          // как на консоли — очередь ограничена
    bullets.push({ x: cannonX, y: CANNON_ROW - 1 });
  }

  function moveBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.y < 0) { bullets.splice(i, 1); continue; }
      if (grid[b.y][b.x]) {
        grid[b.y][b.x] = 0;
        bullets.splice(i, 1);
        score += 10 * level;
        killed++;
        if (killed % 25 === 0) levelUp();
        syncHud();
        continue;
      }
      b.y--;
    }
  }

  function levelUp() {
    level++;
    dropInterval = Math.max(180, 900 - (level - 1) * 70);
    setMsg("LEVEL " + level + "!");
    syncHud();
  }

  function move(dir) {
    if (state !== "play") return;
    cannonX = Math.max(0, Math.min(COLS - 1, cannonX + dir));
  }

  function setMsg(html) { el.msg.innerHTML = html; }
  function syncHud() {
    el.score.textContent = score;
    el.level.textContent = level;
    el.lives.textContent = Math.max(0, lives);
  }

  // ---- отрисовка: каждая клетка = квадрат в квадрате, как на LCD ----
  function drawCell(x, y, on) {
    const px = x * CELL, py = y * CELL;
    ctx.strokeStyle = on ? "#2b3122" : "rgba(43,49,34,.15)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(px + PAD + .75, py + PAD + .75, CELL - 2 * PAD - 1.5, CELL - 2 * PAD - 1.5);
    if (on) {
      ctx.fillStyle = "#2b3122";
      ctx.fillRect(px + PAD + 4, py + PAD + 4, CELL - 2 * PAD - 8, CELL - 2 * PAD - 8);
    }
  }

  function render() {
    ctx.fillStyle = "#9ead86";
    ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

    const on = emptyGrid();
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x]) on[y][x] = 1;

    for (const b of bullets) if (b.y >= 0) on[b.y][b.x] = 1;
    if (state !== "over") on[CANNON_ROW][cannonX] = 1;

    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        drawCell(x, y, on[y][x]);
  }

  // ---- игровой цикл ----
  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;

    if (state === "play") {
      bulletTimer += dt;
      while (bulletTimer >= 60) { bulletTimer -= 60; moveBullets(); }

      dropTimer += dt;
      if (dropTimer >= dropInterval) { dropTimer = 0; dropWall(); }
    }

    render();
    requestAnimationFrame(loop);
  }

  // ---- управление ----
  const held = { left: false, right: false };
  setInterval(() => {
    if (state !== "play") return;
    if (held.left)  move(-1);
    if (held.right) move(1);
  }, 110);

  document.addEventListener("keydown", e => {
    switch (e.key) {
      case "ArrowLeft":  held.left = true;  move(-1); e.preventDefault(); break;
      case "ArrowRight": held.right = true; move(1);  e.preventDefault(); break;
      case " ":
      case "ArrowUp":    fire(); e.preventDefault(); break;
      case "p": case "P": case "з": case "З": togglePause(); break;
      case "r": case "R": case "к": case "К": newGame(); break;
    }
  });
  document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft")  held.left = false;
    if (e.key === "ArrowRight") held.right = false;
  });

  function togglePause() {
    if (state === "play") { state = "pause"; setMsg("PAUSE"); }
    else if (state === "pause") { state = "play"; setMsg(""); }
  }

  const actions = {
    left:  () => move(-1),
    right: () => move(1),
    fire,
    pause: togglePause,
    reset: newGame,
  };
  for (const btn of document.querySelectorAll("button.k")) {
    const act = btn.dataset.act;
    const down = e => {
      e.preventDefault();
      actions[act]();
      if (act === "left")  held.left = true;
      if (act === "right") held.right = true;
    };
    const up = () => { held.left = false; held.right = false; };
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointerleave", up);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
