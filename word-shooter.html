<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Shooter — стрелялка по словам</title>
<style>
  :root {
    --lcd-bg: #9ead86;
    --lcd-ink: #2b3122;
    --case: #f0c419;
    --case-dark: #c99f10;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #232326;
    font-family: "Courier New", monospace;
    color: var(--lcd-ink);
    -webkit-user-select: none;
    user-select: none;
  }
  .console {
    background: linear-gradient(160deg, var(--case), var(--case-dark));
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 14px 44px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .screen {
    background: var(--lcd-bg);
    border: 4px solid #7c8a66;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    gap: 8px;
  }
  canvas { display: block; border-radius: 2px; cursor: crosshair; touch-action: none; }
  .hud {
    width: 112px;
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 1px;
    display: flex;
    flex-direction: column;
  }
  .hud .label { opacity: .6; }
  .hud .value { font-size: 20px; font-weight: bold; margin-bottom: 7px; }
  .hud .value.small { font-size: 15px; }
  .msg { margin-top: auto; font-size: 11px; line-height: 1.5; min-height: 62px; }
  .lang {
    margin-top: 8px;
    display: flex;
    gap: 4px;
  }
  .lang button {
    flex: 1;
    font: inherit;
    font-size: 11px;
    padding: 4px 0;
    border: 1.5px solid var(--lcd-ink);
    background: transparent;
    color: var(--lcd-ink);
    border-radius: 3px;
    cursor: pointer;
  }
  .lang button.on { background: var(--lcd-ink); color: var(--lcd-bg); }
  .hint {
    margin-top: 12px;
    text-align: center;
    color: #7a6812;
    font-size: 11px;
    line-height: 1.6;
  }
  kbd {
    background: #3a3a3f; color: #eee; border-radius: 4px;
    padding: 1px 6px; font: inherit; font-size: 10px;
  }
</style>
</head>
<body>
<div class="console">
  <div class="screen">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="label">SCORE</div><div class="value" id="score">0</div>
      <div class="label">LEVEL</div><div class="value" id="level">1</div>
      <div class="label">COMBO</div><div class="value small" id="combo">x1</div>
      <div class="label">LIVES</div><div class="value small" id="lives">♥♥♥</div>
      <div class="label">BOMBS</div><div class="value small" id="bombs">◆◆◆</div>
      <div class="msg" id="msg"></div>
      <div class="lang">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <div class="hint">
    <kbd>Enter</kbd> — начать игру · <b>мышь</b> — наводить пушку (или <kbd>←</kbd> <kbd>→</kbd>)<br>
    Подведи пушку под блок и напечатай <b>недостающую букву</b><br>
    <b>клик</b> или <kbd>Space</kbd> — подрыв блока на линии огня · <kbd>Esc</kbd> пауза
  </div>
</div>

  // ------------------------------------------------------------ блоки-слова
  function makeBlock() {
    const list = WORDS[lang];
    // на старших уровнях слова длиннее
    const maxLen = level < 3 ? 5 : level < 6 ? 7 : 99;
    const pool = list.filter(w => w.length <= maxLen);
    const word = pool[(Math.random() * pool.length) | 0];
    const gap = (Math.random() * word.length) | 0;

    // честность: принимаем любую букву, дающую слово из того же словаря
    const accepts = new Set();
    for (const ch of ALPHABET[lang]) {
      const candidate = word.slice(0, gap) + ch + word.slice(gap + 1);
      if (DICT[lang].has(candidate)) accepts.add(ch);
    }
    accepts.add(word[gap]);

    const w = 26 + word.length * 21;
    const b = {
      word, gap, accepts,
      w, h: 40,
      x: 0,
      y: -40,
      speed: 20 + (level - 1) * 4.5,
      state: "live",
      timer: 0,
    };
    // ищем позицию, не налезающую на свежие блоки сверху
    for (let attempt = 0; attempt < 12; attempt++) {
      b.x = 10 + Math.random() * (W - 20 - w);
      const clash = blocks.some(o => o.y < 90 &&
        b.x < o.x + o.w + 12 && o.x < b.x + b.w + 12);
      if (!clash) break;
    }
    return b;
  }

  function spawn() { blocks.push(makeBlock()); }

  // ----------------------------------------------------------------- стрельба
  // Наводки нет: буква уходит строго вверх из текущей позиции пушки
  // и достаётся первому блоку на линии огня — подходит она ему или нет.
  function shootLetter(letter) {
    if (state !== "play") return;
    if (cooldown > 0 || shots.length >= MAX_SHOTS) return;

    cooldown = SHOT_COOLDOWN;
    lastKey = letter; lastKeyAt = performance.now(); lastKeyOk = null;
    shots.push({ letter, x: cannonX, y: CANNON_Y - 14 });
  }

  // Первый блок, в который упрётся выстрел из текущей позиции пушки.
  function blockInLine() {
    let hit = null;
    for (const b of blocks) {
      if (b.state === "solved" || b.state === "dead") continue;
      if (cannonX < b.x || cannonX > b.x + b.w) continue;
      if (b.y + b.h > CANNON_Y) continue;
      if (!hit || b.y > hit.y) hit = b;         // самый нижний по линии
    }
    return hit;
  }

  function bomb() {
    if (state !== "play") return;
    if (bombs <= 0) { setMsg("Заряды кончились!"); shake = 4; return; }
    const victim = blockInLine();
    if (!victim) { setMsg("На линии огня<br>пусто."); return; }
    bombs--;
    combo = 0;                            // подрыв не считается за решение
    burst(victim, 26);
    victim.state = "dead";
    victim.timer = 0;
    shake = 9;
    setMsg("Подрыв: слово<br>не засчитано.");
    syncHud();
  }

  function solve(b, letter) {
    // показываем слово именно с той буквой, которой в него попали
    if (letter) b.word = b.word.slice(0, b.gap) + letter + b.word.slice(b.gap + 1);
    lastKeyOk = true;
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    solved++;
    const mult = Math.min(1 + Math.floor(combo / 5), 5);
    score += (50 + b.word.length * 25) * level * mult;
    b.state = "solved";
    b.timer = 0;
    burst(b, 14);
    if (solved % 8 === 0) levelUp();
    if (solved % 10 === 0 && bombs < 5) { bombs++; setMsg("+1 заряд"); }
    syncHud();
  }

  // буква прилетела в блок, которому она не подходит
  function miss(b) {
    lastKeyOk = false;
    combo = 0;
    shake = Math.max(shake, 7);
    // показываем шаблон, а не загаданное слово — иначе промах выдаёт ответ
    if (b) {
      b.hurt = 0.35;
      const mask = b.word.split("")
        .map((ch, i) => i === b.gap ? "_" : ch.toUpperCase()).join("");
      setMsg("Не подходит:<br>" + mask);
    }
    syncHud();
  }

  function levelUp() {
    level++;
    spawnInterval = Math.max(750, 2400 - (level - 1) * 165);
    setMsg("LEVEL " + level);
    flash = 1;
  }

  function loseLife(b) {
    b.state = "dead"; b.timer = 0;
    burst(b, 30);
    lives--; combo = 0; shake = 16;
    if (lives <= 0) {
      state = "over";
      setMsg("GAME OVER<br>Слов: " + solved + "<br>Комбо: " + bestCombo +
             "<br>ENTER — заново");
    } else {
      setMsg("Пропущено:<br>" + b.word.toUpperCase());
    }
    syncHud();
  }

  function burst(b, n) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 150;
      sparks.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

  // -------------------------------------------------------------------- шаг
  function update(dt) {
    if (state !== "play") { decay(dt); return; }

    cooldown = Math.max(0, cooldown - dt);

    if (held.left)  cannonX -= CANNON_SPEED * dt;
    if (held.right) cannonX += CANNON_SPEED * dt;
    cannonX = Math.max(16, Math.min(W - 16, cannonX));

    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0) { spawn(); spawnTimer = spawnInterval; }

    for (const b of blocks) {
      if (b.state === "solved" || b.state === "dead") { b.timer += dt; continue; }
      if (b.hurt) b.hurt = Math.max(0, b.hurt - dt);
      b.y += b.speed * dt;
      if (b.y + b.h >= DANGER_Y) loseLife(b);
    }

    for (let i = shots.length - 1; i >= 0; i--) {
      if (flyShot(shots[i], dt)) shots.splice(i, 1);
    }

    blocks = blocks.filter(b =>
      (b.state !== "solved" && b.state !== "dead") || b.timer < 0.45);

    decay(dt);
  }

  // Полёт вверх мелкими шагами, чтобы быстрый снаряд не проскочил сквозь блок.
  // Возвращает true, если снаряд отработал и его пора убрать.
  function flyShot(s, dt) {
    let left = SHOT_SPEED * dt;
    while (left > 0) {
      const step = Math.min(left, 8);
      s.y -= step; left -= step;

      for (const b of blocks) {
        if (b.state === "solved" || b.state === "dead") continue;
        if (s.x < b.x || s.x > b.x + b.w) continue;
        if (s.y > b.y + b.h || s.y < b.y) continue;
        if (b.accepts.has(s.letter)) solve(b, s.letter);
        else miss(b);
        return true;
      }

      if (s.y < -20) { miss(null); return true; }   // ушёл в молоко
    }
    return false;
  }

  function decay(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      p.life -= dt * 2.2;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 2.5);
  }

  // ----------------------------------------------------------------- отрисовка
  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    ctx.fillStyle = "#9ead86";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (flash > 0) {
      ctx.fillStyle = "rgba(43,49,34," + (flash * .18) + ")";
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // тонкая сетка «пикселей» LCD
    ctx.strokeStyle = "rgba(43,49,34,.05)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 22) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 22) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // линия гибели
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = "rgba(43,49,34,.45)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);

    // блок на линии огня — по нему и прилетит следующая буква
    const aimed = state === "play" || state === "pause" ? blockInLine() : null;

    // сама линия огня
    if (state === "play" || state === "pause") {
      ctx.setLineDash([3, 7]);
      ctx.strokeStyle = "rgba(43,49,34,.35)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cannonX, CANNON_Y - 16);
      ctx.lineTo(cannonX, aimed ? aimed.y + aimed.h : 0);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const b of blocks) drawBlock(b, b === aimed);
    for (const s of shots) drawShot(s);
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = INK;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    drawCannon();

    if (state === "ready") banner("WORD SHOOTER", "ENTER — начать игру");
    if (state === "pause") banner("PAUSE", "ESC — продолжить");
    if (state === "over")  banner("GAME OVER", "ENTER — заново");

    ctx.restore();
  }

  function drawBlock(b, isTarget) {
    const solvedNow = b.state === "solved";
    const dead = b.state === "dead";
    const t = b.timer / 0.45;

    ctx.save();
    if (solvedNow || dead) {
      ctx.globalAlpha = Math.max(0, 1 - t);
      const s = 1 + t * 0.35;
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.scale(s, s);
      ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
    }

    // корпус; hurt — вспышка от буквы, которая блоку не подошла
    ctx.fillStyle = solvedNow ? INK
                  : b.hurt ? "rgba(43,49,34,.45)"
                  : "rgba(43,49,34,.10)";
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.lineWidth = isTarget && !solvedNow && !dead ? 3 : 1.5;
    ctx.strokeStyle = INK;
    ctx.stroke();

    // буквы
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const step = (b.w - 26) / b.word.length;
    const startX = b.x + 13 + step / 2;
    for (let i = 0; i < b.word.length; i++) {
      const cx = startX + i * step, cy = b.y + b.h / 2 + 1;
      const isGap = i === b.gap;
      if (isGap && !solvedNow) {
        // пустая ячейка под букву
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - step / 2 + 3, cy + 11);
        ctx.lineTo(cx + step / 2 - 3, cy + 11);
        ctx.stroke();
      } else {
        ctx.fillStyle = solvedNow ? "#9ead86" : INK;
        ctx.fillText(b.word[i].toUpperCase(), cx, cy);
      }
    }
    ctx.restore();
  }

  function drawShot(s) {
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ead86";
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(s.letter.toUpperCase(), s.x, s.y + 1);
  }

  function drawCannon() {
    ctx.save();
    ctx.translate(cannonX, CANNON_Y);
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    ctx.lineWidth = 6;
    ctx.beginPath();                 // ствол всегда строго вверх
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -26);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();
    // лафет
    ctx.fillRect(-20, 6, 40, 8);
    ctx.restore();

    // итог последнего выстрела: пока летит — просто буква, потом ✓ или ✕
    if (lastKey && performance.now() - lastKeyAt < 700) {
      ctx.globalAlpha = 1 - (performance.now() - lastKeyAt) / 700;
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = INK;
      const mark = lastKeyOk === true ? " ✓" : lastKeyOk === false ? " ✕" : "";
      ctx.fillText(lastKey.toUpperCase() + mark, cannonX, CANNON_Y + 28);
      ctx.globalAlpha = 1;
    }
  }

  function banner(title, sub) {
    ctx.fillStyle = "rgba(158,173,134,.86)";
    ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.strokeRect(0, H / 2 - 60, W, 120);
    ctx.fillStyle = INK;
    ctx.textAlign = "center";
    ctx.font = "bold 30px 'Courier New', monospace";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText(sub, W / 2, H / 2 + 24);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // -------------------------------------------------------------------- HUD
  function setMsg(html) { el.msg.innerHTML = html; }
  function syncHud() {
    el.score.textContent = score;
    el.level.textContent = level;
    el.combo.textContent = "x" + Math.min(1 + Math.floor(combo / 5), 5) +
                           (combo > 1 ? " (" + combo + ")" : "");
    el.lives.textContent = "♥".repeat(Math.max(0, lives)) || "—";
    el.bombs.textContent = "◆".repeat(bombs) || "—";
  }

  // ---------------------------------------------------------------- ввод
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    if (e.key === "Escape") {
      e.preventDefault();
      if (state === "play") { state = "pause"; setMsg("Пауза"); }
      else if (state === "pause") { state = "play"; setMsg(""); }
      return;
    }

    // со стартового экрана и после конца партии игру начинает любая клавиша
    if (state === "ready" || state === "over") {
      if (e.key === "Enter" || e.key === " " || resolveLetter(e)) {
        e.preventDefault();
        reset(true);
      }
      return;
    }

    if (e.key === "ArrowLeft")  { e.preventDefault(); held.left = true;  return; }
    if (e.key === "ArrowRight") { e.preventDefault(); held.right = true; return; }
    if (e.key === "Enter") { e.preventDefault(); reset(true); return; }
    if (e.key === " ") { e.preventDefault(); bomb(); return; }

    const letter = resolveLetter(e);
    if (letter) { e.preventDefault(); shootLetter(letter); }
  });

  document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft")  held.left = false;
    if (e.key === "ArrowRight") held.right = false;
  });

  // Основное управление — мышь: пушка встаёт под курсор мгновенно, без разгона.
  // Стрелки оставлены как запасной вариант и в движении проигрывают мыши.
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    cannonX = Math.max(16, Math.min(W - 16, x));
    held.left = held.right = false;
  });
  // клик — подрыв блока на линии огня, чтобы не тянуться к пробелу
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "ready" || state === "over") reset(true);
    else bomb();
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  // если вкладка потеряла фокус с зажатой стрелкой, пушка не должна «залипнуть»
  window.addEventListener("blur", () => { held.left = held.right = false; });

  // Буква определяется и по e.key, и по физической клавише — чтобы играть
  // в русские слова, не переключая раскладку системы (и наоборот).
  function resolveLetter(e) {
    const key = (e.key || "").toLowerCase();
    if (key.length === 1 && ALPHABET[lang].includes(key)) return key;
    if (lang === "ru") {
      const mapped = RU_BY_CODE[e.code];
      if (mapped) return mapped;
      if (key === "ё") return "е";
    } else if (e.code && /^Key[A-Z]$/.test(e.code)) {
      return e.code.slice(3).toLowerCase();
    }
    return null;
  }

  for (const btn of document.querySelectorAll(".lang button")) {
    btn.addEventListener("click", () => {
      lang = btn.dataset.lang;
      localStorage.setItem("ws-lang", lang);
      syncLangButtons();
      reset();
      btn.blur();
    });
  }
  function syncLangButtons() {
    for (const btn of document.querySelectorAll(".lang button")) {
      btn.classList.toggle("on", btn.dataset.lang === lang);
    }
  }

  // ---------------------------------------------------------------- цикл
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);   // защита от долгих пауз вкладки
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  syncLangButtons();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
