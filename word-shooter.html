<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Shooter — стрелялка по словам</title>
<style>
  :root {
    --lcd-bg: #9ead86;
    --lcd-ink: #2b3122;
    --case: #f0c419;
    --case-dark: #c99f10;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #232326;
    font-family: "Courier New", monospace;
    color: var(--lcd-ink);
    -webkit-user-select: none;
    user-select: none;
  }
  .console {
    background: linear-gradient(160deg, var(--case), var(--case-dark));
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 14px 44px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .screen {
    background: var(--lcd-bg);
    border: 4px solid #7c8a66;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    gap: 8px;
  }
  canvas { display: block; border-radius: 2px; cursor: crosshair; touch-action: none; }
  .hud {
    width: 112px;
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 1px;
    display: flex;
    flex-direction: column;
  }
  .hud .label { opacity: .6; }
  .hud .value { font-size: 20px; font-weight: bold; margin-bottom: 7px; }
  .hud .value.small { font-size: 15px; }
  .hud .rules { font-size: 10px; line-height: 1.4; opacity: .75; margin: -6px 0 8px; }
  .msg { margin-top: auto; font-size: 11px; line-height: 1.5; min-height: 62px; }
  .lang {
    margin-top: 8px;
    display: flex;
    gap: 4px;
  }
  .lang button {
    flex: 1;
    font: inherit;
    font-size: 11px;
    padding: 4px 0;
    border: 1.5px solid var(--lcd-ink);
    background: transparent;
    color: var(--lcd-ink);
    border-radius: 3px;
    cursor: pointer;
  }
  .lang button.on { background: var(--lcd-ink); color: var(--lcd-bg); }
  .hint {
    margin-top: 12px;
    text-align: center;
    color: #7a6812;
    font-size: 11px;
    line-height: 1.6;
  }
  kbd {
    background: #3a3a3f; color: #eee; border-radius: 4px;
    padding: 1px 6px; font: inherit; font-size: 10px;
  }
</style>
</head>
<body>
<div class="console">
  <div class="screen">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="label">SCORE</div><div class="value" id="score">0</div>
      <div class="label">ЭТАП</div><div class="value" id="level">1</div>
      <div class="rules" id="rules"></div>
      <div class="label">COMBO</div><div class="value small" id="combo">x1</div>
      <div class="label">LIVES</div><div class="value small" id="lives">♥♥♥</div>
      <div class="label">BOMBS</div><div class="value small" id="bombs">◆◆◆</div>
      <div class="msg" id="msg"></div>
      <div class="lang">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <div class="hint">
    В меню: <kbd>↑</kbd> <kbd>↓</kbd> и <kbd>Enter</kbd> или мышь<br>
    В игре: <b>мышь</b> наводит пушку (или <kbd>←</kbd> <kbd>→</kbd>),
    печатай <b>недостающую букву</b> — встанет сама<br>
    <b>ЛКМ</b> — сбить блок на линии огня (бесплатно, но комбо сгорает) ·
    <kbd>Space</kbd> — снести всё поле (1 заряд)<br>
    <kbd>Esc</kbd> — пауза
  </div>
</div>

        "county crest den desert desktop dig district downtown edge empire end exterior field front frontier " +
        "habitat harbor harbour heaven heights here holy home homeland hometown horizon inside interior " +
        "jungle latitude lawn left locale middle oasis open orbit origin outdoors outline outside paradise " +
        "park parts place plaza polls port position post prairie premises province reach region resort roads " +
        "rough route scene seat see setting side site source spa spot state surround tee terrain there thick " +
        "tip top town township tract trend unknown venue zone",
      // Время: 90
      time:
        "aurora autumn birth birthday calendar century close cycle date dawn day days deadline decade deep " +
        "delay duration dying era even evening fall festival float flush flux full future grave history " +
        "holiday hour hours instant interim interval last leave leisure lifetime midnight min minute moment " +
        "month morning mph night none noon now offset old over pace past payday period phase picnic present " +
        "rate rev rpm season sec second semester span speed spring stage summer sunrise sunset teens then " +
        "times today tomorrow tonight vacation velocity wait week weekend while winter year years",
    },
  };
  const THEME_NAMES = {
    animal: "Животные",
    food: "Еда",
    plant: "Растения",
    body: "Тело",
    thing: "Вещи",
    nature: "Природа",
    place: "Места",
    time: "Время",
  };
  // >>> WORDLIST END <<<

  // CORPUS собирает tools/build-wordlist.mjs: слова по убыванию частотности.
  // Позиция в списке и есть ранг — ось сложности «насколько слово ходовое».
  // Отсюда же берутся и слова для блоков, и проверка ответов.
  const RANK = { ru: new Map(), en: new Map() };   // слово -> ранг
  const BY_LEN = { ru: new Map(), en: new Map() }; // длина -> слова по частоте
  for (const lg of ["ru", "en"]) {
    const list = CORPUS[lg].split(" ");
    for (let i = 0; i < list.length; i++) {
      const w = list[i];
      if (!w || RANK[lg].has(w)) continue;
      RANK[lg].set(w, i + 1);
      if (!BY_LEN[lg].has(w.length)) BY_LEN[lg].set(w.length, []);
      BY_LEN[lg].get(w.length).push(w);
    }
  }
  const rankOf = w => RANK[lang].get(w) ?? 99999;

  // Часть речи: POS — строка по символу на слово, в порядке корпуса.
  const PART = { ru: new Map(), en: new Map() };
  for (const lg of ["ru", "en"]) {
    const list = CORPUS[lg].split(" ");
    for (let i = 0; i < list.length; i++)
      if (list[i] && !PART[lg].has(list[i])) PART[lg].set(list[i], POS[lg][i]);
  }
  const partOf = w => PART[lang].get(w) || "-";

  // Темы: слово -> список тем, тема -> слова. Данные собраны, но геймплей их
  // пока не трогает: сюда подключаются тематические паки, а тема сложность не
  // повышает, а понижает — игрок читает Р_КЕТА, уже зная, что тема «космос».
  const THEME_OF = { ru: new Map(), en: new Map() };
  const THEME_POOL = { ru: new Map(), en: new Map() };
  for (const lg of ["ru", "en"]) {
    for (const id of Object.keys(THEMES[lg])) {
      const list = THEMES[lg][id].split(" ").filter(Boolean);
      THEME_POOL[lg].set(id, list);
      for (const w of list) {
        if (!THEME_OF[lg].has(w)) THEME_OF[lg].set(w, []);
        THEME_OF[lg].get(w).push(id);
      }
    }
  }
  const themesOf = w => THEME_OF[lang].get(w) || [];
  const themePool = id => THEME_POOL[lang].get(id) || [];

  // Соседи — слова той же длины, отличающиеся не более чем на maxGaps букв.
  // Считаются на лету: корпус на десятки тысяч слов дешевле возить целиком,
  // чем хранить россыпь соседей под каждое слово.
  const NEIGHBOUR_CAP = 150;
  function neighboursOf(word, limit) {
    const out = [];
    for (const w of BY_LEN[lang].get(word.length) || []) {
      if (w === word) continue;
      let d = 0;
      for (let i = 0; i < word.length && d <= limit; i++) if (w[i] !== word[i]) d++;
      if (d <= limit) { out.push(w); if (out.length >= NEIGHBOUR_CAP) break; }
    }
    return out;
  }

  const ALPHABET = {
    ru: "абвгдежзийклмнопрстуфхцчшщъыьэюя",
    en: "abcdefghijklmnopqrstuvwxyz",
  };

  // физическая раскладка QWERTY -> кириллица, чтобы играть в RU
  // с любой активной раскладкой системы
  const RU_BY_CODE = {
    KeyQ:"й",KeyW:"ц",KeyE:"у",KeyR:"к",KeyT:"е",KeyY:"н",KeyU:"г",KeyI:"ш",
    KeyO:"щ",KeyP:"з",BracketLeft:"х",BracketRight:"ъ",KeyA:"ф",KeyS:"ы",
    KeyD:"в",KeyF:"а",KeyG:"п",KeyH:"р",KeyJ:"о",KeyK:"л",KeyL:"д",
    Semicolon:"ж",Quote:"э",KeyZ:"я",KeyX:"ч",KeyC:"с",KeyV:"м",KeyB:"и",
    KeyN:"т",KeyM:"ь",Comma:"б",Period:"ю",
  };

  // ------------------------------------------------------------------ холст
  const W = 470, H = 660;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);

  const INK = "#2b3122";
  const RED = "#b03a2e";       // единственный цвет на монохромном экране:
                               // им помечено только испорченное слово
  const DANGER_Y = H - 74;     // ниже — потеря жизни
  const CANNON_Y = H - 34;

  const el = {
    score: document.getElementById("score"),
    level: document.getElementById("level"),
    combo: document.getElementById("combo"),
    lives: document.getElementById("lives"),
    bombs: document.getElementById("bombs"),
    rules: document.getElementById("rules"),
    msg:   document.getElementById("msg"),
  };

  // ------------------------------------------------------------------ стейт
  let lang = localStorage.getItem("ws-lang") || "ru";
  let blocks, shots, sparks, reveals;
  let score, lives, bombs, combo, bestCombo, solved;
  let stage, stageSpawned, poolDry;   // номер этапа, сколько он выпустил, кончились ли слова
  let spawnTimer, state, shake, flash;
  const SPAWN_GAP = 600;         // мс между блоками — антизалп
  const SPAWN_RETRY = 200;       // мс до следующей попытки, если места нет
  let cannonX, cooldown;
  let lastKey = null, lastKeyOk = false, lastKeyAt = 0;
  const held = { left: false, right: false };

  const CANNON_SPEED = 300;      // px/s
  const SHOT_SPEED = 720;        // px/s
  const MAX_SHOTS = 4;
  const SHOT_COOLDOWN = 0.09;    // s

  // ------------------------------------------------------------- модификаторы
  // Правила, которые выбирает игрок, а не уровень. Хранятся между сессиями.
  const mods = { aim: false, verbs: false, adjs: false, theme: "" };
  try { Object.assign(mods, JSON.parse(localStorage.getItem("ws-mods") || "{}")); }
  catch { /* испорченная запись — играем с настройками по умолчанию */ }
  if (mods.theme && !THEME_NAMES[mods.theme]) mods.theme = "";   // тема из старой сборки
  const saveMods = () => localStorage.setItem("ws-mods", JSON.stringify(mods));

  // Пустая строка — тема не выбрана, слова берутся из всего корпуса.
  const THEME_OPTIONS = ["", ...Object.keys(THEME_NAMES)];
  const themeLabel = id => id ? THEME_NAMES[id] : "все";

  // -------------------------------------------------------------------- меню
  // open — открытый выпадающий список, opt — подсвеченный в нём пункт
  const menu = { screen: "root", index: 0, open: null, opt: 0 };

  const SCREENS = {
    root: [
      { label: "Начать игру", act: () => reset(true) },
      { label: "Модификаторы", act: () => { menu.screen = "mods"; menu.index = 0; } },
    ],
    mods: [
      { label: "Прицел по букве",
        value: () => mods.aim ? "вкл" : "выкл",
        hint: "Целиться нужно в сам пропуск,<br>а не просто в блок",
        act: () => { mods.aim = !mods.aim; saveMods(); syncHud(); } },
      { label: "Глаголы",
        value: () => mods.verbs ? "вкл" : "выкл",
        hint: "Добавить к существительным глаголы:<br>БЕ_АТЬ, УВИ_ЕТЬ",
        act: () => { mods.verbs = !mods.verbs; saveMods(); dropBag(); syncHud(); } },
      { label: "Прилагательные",
        value: () => mods.adjs ? "вкл" : "выкл",
        hint: "Добавить прилагательные:<br>КРА_НЫЙ, БЫС_РЫЙ",
        act: () => { mods.adjs = !mods.adjs; saveMods(); dropBag(); syncHud(); } },
      { label: "Тема",
        value: () => themeLabel(mods.theme),
        hint: "Слова только из выбранной темы.<br>ENTER — список, ← → — по кругу",
        act: () => { menu.open = "theme"; menu.opt = THEME_OPTIONS.indexOf(mods.theme); },
        // список длинный, поэтому стрелки листают его, не открывая
        cycle: d => {
          const n = THEME_OPTIONS.length;
          const at = (THEME_OPTIONS.indexOf(mods.theme) + d + n) % n;
          pickTheme(THEME_OPTIONS[at]);
        } },
      { label: "Язык",
        value: () => lang.toUpperCase(),
        hint: "Словарь и раскладка",
        act: () => { setLang(lang === "ru" ? "en" : "ru"); } },
      { label: "Назад", act: () => { menu.screen = "root"; menu.index = 0; } },
    ],
  };

  const menuItems = () => SCREENS[menu.screen];

  // Прямоугольник пункта — общий для отрисовки и попадания мышью.
  const MENU_TOP = H / 2 - 40, MENU_STEP = 44, MENU_W = 300;
  function itemRect(i) {
    return { x: (W - MENU_W) / 2, y: MENU_TOP + i * MENU_STEP, w: MENU_W, h: 36 };
  }
  function itemAt(x, y) {
    for (let i = 0; i < menuItems().length; i++) {
      const r = itemRect(i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  // Выпадающий список: рисуется поверх меню по центру, поэтому геометрия
  // считается от числа пунктов, а не от того, что под ним.
  const DROP_STEP = 28, DROP_W = 230;
  const dropTop = n => H / 2 - (n * DROP_STEP) / 2;
  function dropRect(i, n) {
    return { x: (W - DROP_W) / 2, y: dropTop(n) + i * DROP_STEP, w: DROP_W, h: DROP_STEP - 3 };
  }
  function dropAt(x, y) {
    const n = THEME_OPTIONS.length;
    for (let i = 0; i < n; i++) {
      const r = dropRect(i, n);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  function pickTheme(id) {
    mods.theme = id;
    menu.open = null;
    saveMods(); dropBag(); syncHud();
  }

  function dropKey(e) {
    const n = THEME_OPTIONS.length;
    switch (e.key) {
      case "ArrowUp":   menu.opt = (menu.opt - 1 + n) % n; break;
      case "ArrowDown": menu.opt = (menu.opt + 1) % n; break;
      case "Enter":
      case " ":         pickTheme(THEME_OPTIONS[menu.opt]); break;
      case "Escape":    menu.open = null; break;
      default: return false;
    }
    return true;
  }

  function menuKey(e) {
    if (menu.open) return dropKey(e);
    const items = menuItems();
    switch (e.key) {
      case "ArrowUp":   menu.index = (menu.index - 1 + items.length) % items.length; break;
      case "ArrowDown": menu.index = (menu.index + 1) % items.length; break;
      case "ArrowLeft":
      case "ArrowRight": {
        const it = items[menu.index];
        if (it.cycle) it.cycle(e.key === "ArrowLeft" ? -1 : 1);
        else if (it.value) it.act();
        break;
      }
      case "Enter":
      case " ":         items[menu.index].act(); break;
      case "Escape":
        if (menu.screen === "mods") { menu.screen = "root"; menu.index = 1; }
        break;
      default: return false;
    }
    return true;
  }

  function toMenu() {
    menu.screen = "root"; menu.index = 0; menu.open = null;
    state = "ready";
    setMsg("↑ ↓ и ENTER<br>или мышь");
  }

  function reset(startNow) {
    blocks = []; shots = []; sparks = []; reveals = [];
    score = 0; lives = 3; bombs = 3;
    combo = 0; bestCombo = 0; solved = 0;
    stage = 0; stageSpawned = 0; poolDry = false;
    used.clear(); dropBag();
    spawnTimer = 400;
    shake = 0; flash = 0;
    cannonX = W / 2; cooldown = 0;
    held.left = held.right = false;
    if (startNow) {
      state = "play";
      setMsg(STAGES[0].name + "<br>Наведи пушку<br>и печатай букву.");
    } else {
      toMenu();
    }
    syncHud();
  }

  // ---------------------------------------------------------------- сложность
  // Забег — шесть этапов, идущих строго по очереди. Этапы не смешиваются:
  // новый не начинается, пока поле не очистилось от предыдущего, а длины слов
  // у них не пересекаются, так что «короткие» и «длинные» — разные наборы.
  //
  //   len   — длина слова, диапазоны этапов не перекрываются
  //   gaps  — сколько букв выбито, ровно столько, а не «с вероятностью»
  //   speed — px/s
  //   load  — сколько «внимания» помещается на поле разом, см. blockCost
  //   quota — сколько слов этап выпускает; после этого спавн молчит и этап
  //           ждёт, пока поле опустеет
  const STAGES = [
    // У длинных слов одного пропуска нет вовсе: открытых букв столько, что
    // слово угадывается с ходу. Длинные сразу идут с двумя пропусками.
    { name: "КОРОТКИЕ СЛОВА",     len: [3, 4], gaps: 1, speed: 20, load:  5.5, quota: 10 },
    { name: "КОРОТКИЕ, БЫСТРЕЕ",  len: [3, 4], gaps: 1, speed: 32, load:  6.0, quota: 10 },
    { name: "ДЛИННЫЕ СЛОВА",      len: [5, 7], gaps: 2, speed: 20, load:  9.0, quota: 10 },
    { name: "ДЛИННЫЕ, БЫСТРЕЕ",   len: [5, 7], gaps: 2, speed: 26, load:  9.5, quota: 10 },
    { name: "ФИНАЛ",              len: [8, 8], gaps: 3, speed: 10, load: 12.0, quota:  1 },
  ];

  // Цена блока в «единицах внимания». Длинное, редкое и дырявое слово
  // занимает место нескольких простых — так концентрация слов на поле сама
  // подстраивается под их сложность.
  const rarityCost = rank => rank <= 1500 ? 0 : rank <= 4000 ? 0.2
                           : rank <= 10000 ? 0.4 : 0.6;

  function blockCost(b) {
    // считаем по незакрытым пропускам: закрыл один из двух — блок подешевел
    // и место под новое слово освободилось раньше
    const open = Math.max(1, b.shown.filter(ch => !ch).length);
    return 1 + 0.2 * (b.word.length - 3) + 0.8 * (open - 1) + rarityCost(b.rank);
  }

  // Испорченные слова в бюджет не входят: иначе ошибка притормаживала бы поток
  // новых слов, то есть снижала давление вместо того, чтобы повышать его.
  const fieldLoad = () =>
    blocks.reduce((sum, b) => alive(b) && !b.broken ? sum + blockCost(b) : sum, 0);

  const rules = () => STAGES[Math.min(stage, STAGES.length - 1)];

  // прицел задаёт игрок в меню, а не уровень
  function needsAim() { return mods.aim; }

  // ------------------------------------------------------------ выбор слова
  // Служебные слова («что», «если», «меня») занимают верхушку частотного
  // списка и делают загадки скучными, поэтому из корпуса берём слова от 4 букв
  // и не самые ходовые. Курируемый WORDS пускаем всегда: там короткие и
  // приятные «кот», «дом», «лес», нужные на первых уровнях.
  const FUNCTION_WORDS = 300;
  const CURATED = { ru: new Set(WORDS.ru), en: new Set(WORDS.en) };
  // имена: верный ответ, но загадывать их нечестно — угадывать нечего
  const SKIP = { ru: new Set(NO_SPAWN.ru.split(" ")), en: new Set(NO_SPAWN.en.split(" ")) };

  // По умолчанию загадываются только существительные в словарной форме.
  // Падежные и личные формы («стола», «бежал») остаются верными ответами,
  // но сами в блоках не появляются: их часть речи помечена как «прочее».
  function allowedPart(w) {
    const p = partOf(w);
    return p === "n" || (p === "v" && mods.verbs) || (p === "a" && mods.adjs);
  }

  function eligible(w, lo, hi) {
    if (w.length < lo || w.length > hi) return false;
    if (SKIP[lang].has(w)) return false;
    if (!allowedPart(w)) return false;
    // Тема заменяет отбор целиком: её пул и так собран вручную.
    if (mods.theme) return themesOf(w).includes(mods.theme);
    return CURATED[lang].has(w) || (w.length >= 4 && rankOf(w) > FUNCTION_WORDS);
  }

  // Пул забега. Слово вынимается и обратно не возвращается: used живёт всю
  // партию, поэтому за забег ни одно слово не повторится — ни внутри этапа,
  // ни между этапами, у которых длины слов совпадают.
  const used = new Set();
  const pool = { key: "", words: [], at: 0 };

  const dropBag = () => { pool.key = ""; };   // модификаторы сменились — пул другой

  function fillPool(r) {
    const key = [lang, stage, mods.verbs, mods.adjs, mods.theme].join("|");
    if (pool.key === key) return;
    pool.key = key;

    // Тема может не иметь слов нужной длины: в «Растениях» нет ни одного
    // восьмибуквенного. Тогда нижняя планка длины опускается, пока слова не
    // найдутся, — лучше слово покороче, чем этап без единого слова.
    let words = [];
    for (let lo = r.len[0]; lo >= 3; lo--) {
      words = [];
      for (const list of BY_LEN[lang].values())
        for (const w of list) if (!used.has(w) && eligible(w, lo, r.len[1])) words.push(w);
      if (words.length) break;
    }
    for (let i = words.length - 1; i > 0; i--) {          // тасуем
      const j = (Math.random() * (i + 1)) | 0;
      [words[i], words[j]] = [words[j], words[i]];
    }
    pool.words = words;
    pool.at = 0;
  }

  // Блок так и не родился — слово возвращается в пул: игрок его не видел,
  // а иначе каждая неудачная попытка спавна молча съедала бы слово.
  const unuse = w => { used.delete(w); pool.at--; };

  // null — слова кончились; этап на этом и закончится
  function nextWord(r) {
    fillPool(r);
    while (pool.at < pool.words.length) {
      const w = pool.words[pool.at++];
      if (used.has(w)) continue;
      used.add(w);
      return w;
    }
    return null;
  }

  // ------------------------------------------------------------ блоки-слова
  function makeBlock() {
    const r = rules();
    const word = nextWord(r);
    if (!word) { poolDry = true; return null; }
    // Пропусков ровно столько, сколько задал этап, но две буквы в слове
    // всегда остаются открытыми: иначе угадывать не по чему.
    const gapCount = Math.min(r.gaps, word.length - 2);

    const gaps = [];
    while (gaps.length < gapCount) {
      const i = (Math.random() * word.length) | 0;
      if (!gaps.includes(i)) gaps.push(i);
    }
    gaps.sort((a, b) => a - b);

    const w = 26 + word.length * 21;
    const b = {
      word,                                  // загаданное слово
      shown: word.split("").map((ch, i) => gaps.includes(i) ? "" : ch),
      gaps,
      rank: rankOf(word),                    // редкость загаданного, не собранного
      strikes: 0,                            // сколько раз промахнулись по этому слову
      wrong: new Set(),                      // ячейки с неверными буквами
      broken: false,                         // слово испорчено, собрать уже нельзя
      // правило наводки запоминаем при появлении: блок, взлетевший при старых
      // правилах, не должен посреди полёта потребовать точного прицела
      aim: needsAim(),
      // все слова, которые ещё могут получиться: из них считаются верные буквы
      options: [word, ...neighboursOf(word, gapCount)],
      w, h: 40,
      x: 0,
      y: -40,
      speed: r.speed,
      state: "live",
      timer: 0,
    };
    filterOptions(b);

    // Ищем свободную колонку. Если её нет, блок не рождается вовсе: раньше
    // после двенадцати попыток он всё равно вставал поверх соседа.
    const spots = [];
    for (let attempt = 0; attempt < 24; attempt++) {
      const x = 10 + Math.random() * (W - 20 - w);
      if (!blocks.some(o => alive(o) && o.y < b.h + 20 && overlapX(x, w, o))) spots.push(x);
    }
    if (!spots.length) { unuse(word); return null; }
    b.x = spots[0];
    return b;
  }

  const alive = b => b.state !== "solved" && b.state !== "dead";
  const overlapX = (x, w, o) => x < o.x + o.w + GAP && o.x < x + w + GAP;
  const GAP = 8;                          // просвет между блоками, px

  // false — блок не родился: квота этапа выбрана, нет места или поле загружено
  function spawn() {
    const r = rules();
    if (stageSpawned >= r.quota) return false;
    const b = makeBlock();
    if (!b) return false;
    if (fieldLoad() + blockCost(b) > r.load) { unuse(b.word); return false; }
    stageSpawned++;
    blocks.push(b);
    return true;
  }

  // Блоки одного уровня падают с одной скоростью, но после повышения уровня
  // новые быстрее старых и догоняют их. Догнавший не проваливается сквозь
  // соседа, а упирается в него сверху.
  function unstack() {
    const live = blocks.filter(alive).sort((a, b) => b.y - a.y);   // снизу вверх
    for (let i = 0; i < live.length; i++) {
      const b = live[i];
      for (let j = 0; j < i; j++) {
        const o = live[j];                                          // тот, что ниже
        if (!overlapX(b.x, b.w, o)) continue;
        if (b.y + b.h + GAP > o.y) b.y = o.y - b.h - GAP;
      }
    }
  }

  // Оставляем только те слова, что ещё сходятся с открытыми буквами.
  // Загаданное слово в списке всегда, так что верный ответ не потеряется.
  function filterOptions(b) {
    b.options = b.options.filter(o =>
      o.length === b.word.length && b.shown.every((ch, i) => !ch || o[i] === ch));
  }

  // Какие буквы засчитываются в конкретный пропуск. Считаем по оставшимся
  // вариантам, поэтому в двухбуквенном пропуске буквы проверяются совместно:
  // после первой попавшей буквы список сужается, и вторая уже строже.
  function acceptsAt(b, i) {
    const out = new Set();
    for (const o of b.options) out.add(o[i]);
    return out;
  }

  // Куда сама встанет буква, если целиться необязательно: первый слева
  // незакрытый пропуск, которому она подходит. -1 — не подходит никуда.
  function gapFor(b, letter) {
    for (const i of b.gaps)
      if (!b.shown[i] && acceptsAt(b, i).has(letter)) return i;
    return -1;
  }

  // Номер буквы под выстрелом — сетка ячеек внутри блока.
  function cellAt(b, x) {
    const step = (b.w - 26) / b.word.length;
    const i = Math.floor((x - (b.x + 13)) / step);
    return i >= 0 && i < b.word.length ? i : -1;
  }

  // ----------------------------------------------------------------- стрельба
  // Наводки нет: буква уходит строго вверх из текущей позиции пушки
  // и достаётся первому блоку на линии огня — подходит она ему или нет.
  function shootLetter(letter) {
    if (state !== "play") return;
    if (cooldown > 0 || shots.length >= MAX_SHOTS) return;

    cooldown = SHOT_COOLDOWN;
    lastKey = letter; lastKeyAt = performance.now(); lastKeyOk = null;
    shots.push({ letter, x: cannonX, y: CANNON_Y - 14 });
  }

  // Первый блок, в который упрётся выстрел из текущей позиции пушки.
  function blockInLine() {
    let hit = null;
    for (const b of blocks) {
      if (b.state === "solved" || b.state === "dead") continue;
      if (cannonX < b.x || cannonX > b.x + b.w) continue;
      if (b.y + b.h > CANNON_Y) continue;
      if (!hit || b.y > hit.y) hit = b;         // самый нижний по линии
    }
    return hit;
  }

  // Подрывы не засчитывают слова и сжигают комбо: это аварийный выход,
  // а не способ набирать очки. Оба берут заряды из общего запаса, но полная
  // зачистка стоит дороже точечного подрыва.
  const CLEAR_COST = 1;

  // true — подрыв состоялся
  function detonate(victims, cost, what) {
    if (state !== "play") return false;
    if (bombs < cost) {
      setMsg(bombs ? "Нужно зарядов: " + cost : "Заряды кончились!");
      shake = 4;
      return false;
    }
    if (!victims.length) { setMsg("Поле и так<br>пустое."); return false; }

    const wide = victims.length > 1;
    bombs -= cost;
    combo = 0;
    for (const b of victims) {
      burst(b, wide ? 18 : 26);
      b.state = "dead";
      b.timer = 0;
    }
    shake = wide ? 18 : 9;
    flash = wide ? 1 : 0;
    setMsg(what);
    syncHud();
    return true;
  }

  // Клик — бесплатный снос одного блока: способ отделаться от слова, которое
  // не поддаётся. Платой служит комбо, поэтому злоупотребление бьёт по очкам.
  function bombOne() {
    const victim = blockInLine();
    if (!victim) { setMsg("На линии огня<br>пусто."); return; }
    if (detonate([victim], 0, "Сбито: слово<br>не засчитано.")) reveal(victim);
  }

  // Показываем загаданное слово на месте сбитого блока: игрок сбил его именно
  // потому, что не разгадал, и должен увидеть, что там было.
  // Появляется сразу непрозрачной и держится, пока слово читается,
  // потом плавно гаснет. Общее время короткое: карточка не должна мешать.
  const REVEAL_TIME = 1.3;
  const REVEAL_HOLD = 0.4;       // сколько держится на полной яркости
  function reveal(b) {
    reveals.push({
      word: b.word,
      // неразгаданное — и пустые пропуски, и те, куда воткнулась неверная буква
      gaps: b.gaps.filter(i => !b.shown[i] || b.wrong.has(i)),
      x: b.x + b.w / 2,
      y: b.y + b.h / 2,
      t: REVEAL_TIME,
    });
  }

  // пробел — зачистка всего поля вместе с летящими буквами
  function bombAll() {
    const victims = blocks.filter(alive);
    if (detonate(victims, CLEAR_COST, "Зачистка: снесено<br>слов — " + victims.length)) {
      shots.length = 0;
    }
  }

  // Буква попала в пропуск и подошла. Слово с двумя пропусками так
  // закрывается в два выстрела, и очки за него идут только целиком.
  function fill(b, i, letter) {
    lastKeyOk = true;
    b.shown[i] = letter;
    filterOptions(b);
    burst(b, 6);
    if (b.shown.some(ch => !ch)) {         // остались пропуски
      setMsg("Есть!<br>Осталось: " + b.shown.filter(ch => !ch).length);
      return;
    }
    solve(b);
  }

  function solve(b) {
    // засчитываем то слово, которое собрал игрок, а не загаданное
    b.word = b.shown.join("");
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    solved++;
    const mult = Math.min(1 + Math.floor(combo / 5), 5);
    score += wordScore(b) * mult;
    b.state = "solved";
    b.timer = 0;
    burst(b, 14);
    if (solved % 10 === 0 && bombs < 5) { bombs++; setMsg("+1 заряд"); }
    syncHud();
  }

  // Очки по той же шкале, что и сложность: длина, редкость, число пропусков.
  function wordScore(b) {
    // ранг именно загаданного слова: собранная альтернатива не должна
    // приносить больше очков только потому, что её нет в данных
    const rarity = b.rank <= 1500 ? 1 : b.rank <= 4000 ? 1.4
                 : b.rank <= 10000 ? 1.8 : 2.4;
    return Math.round((20 * b.word.length + 60 * b.gaps.length) * rarity);
  }

  // Неверная буква. Первый раз — только предупреждение: игра не отличает
  // опечатку от незнания, и убивать слово за случайное нажатие несправедливо.
  // Второй промах по тому же блоку втыкает букву в пропуск, и слово уже не
  // собрать — остаётся снести его кликом или бомбой.
  const STRIKES_TO_BREAK = 2;

  function wrongLetter(b, letter, cell) {
    b.strikes++;
    const i = cell !== -1 ? cell : b.gaps.find(g => !b.shown[g]);
    if (b.strikes < STRIKES_TO_BREAK || i === undefined) {
      miss(b, "Не подходит:");
      return;
    }
    b.shown[i] = letter;
    b.wrong.add(i);
    b.broken = true;
    burst(b, 10);
    miss(b, "Слово испорчено:");
  }

  // буква прилетела в блок, но не подошла
  function miss(b, why) {
    lastKeyOk = false;
    combo = 0;
    shake = Math.max(shake, 7);
    if (b) {
      b.hurt = 0.35;
      // показываем шаблон, а не загаданное слово — иначе промах выдаёт ответ
      setMsg(why + "<br>" +
        b.shown.map(ch => ch ? ch.toUpperCase() : "_").join(""));
    }
    syncHud();
  }

  // Этап отработал: квота выпущена (или слова кончились) и поле опустело.
  // Пока поле не чистое, следующий этап не начинается — этапы не смешиваются.
  const stageDone = () =>
    (stageSpawned >= rules().quota || poolDry) && !blocks.some(alive);

  function nextStage() {
    if (stage >= STAGES.length - 1) { victory(); return; }
    stage++;
    stageSpawned = 0; poolDry = false;
    dropBag();
    const r = rules();
    setMsg(`ЭТАП ${stage + 1}/${STAGES.length}<br>${r.name}<br>` +
           `${r.len[0]}–${r.len[1]} букв · ${r.gaps} ` +
           (r.gaps === 1 ? "пропуск" : r.gaps < 5 ? "пропуска" : "пропусков"));
    flash = 1;
    syncHud();
  }

  function victory() {
    state = "win";
    setMsg("ПОБЕДА!<br>Слов: " + solved + "<br>Очки: " + score +
           "<br>Комбо: " + bestCombo + "<br>ENTER — в меню");
    flash = 1;
    syncHud();
  }

  function loseLife(b) {
    b.state = "dead"; b.timer = 0;
    burst(b, 30);
    lives--; combo = 0; shake = 16;
    if (lives <= 0) {
      state = "over";
      setMsg("GAME OVER<br>Слов: " + solved + "<br>Комбо: " + bestCombo +
             "<br>ENTER — заново");
    } else {
      setMsg("Пропущено:<br>" + b.word.toUpperCase());
    }
    syncHud();
  }

  function burst(b, n) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 150;
      sparks.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

  // -------------------------------------------------------------------- шаг
  function update(dt) {
    if (state !== "play") { decay(dt); return; }

    cooldown = Math.max(0, cooldown - dt);

    if (held.left)  cannonX -= CANNON_SPEED * dt;
    if (held.right) cannonX += CANNON_SPEED * dt;
    cannonX = Math.max(16, Math.min(W - 16, cannonX));

    if (stageDone()) { nextStage(); if (state !== "play") { decay(dt); return; } }

    // Темп задаёт не таймер, а бюджет поля: интервал остался только антизалпом,
    // чтобы освободившееся место не заполнялось пачкой в один кадр.
    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0) spawnTimer = spawn() ? SPAWN_GAP : SPAWN_RETRY;

    for (const b of blocks) {
      if (b.state === "solved" || b.state === "dead") { b.timer += dt; continue; }
      if (b.hurt) b.hurt = Math.max(0, b.hurt - dt);
      b.y += b.speed * dt;
    }
    unstack();
    for (const b of blocks) {
      if (alive(b) && b.y + b.h >= DANGER_Y) loseLife(b);
    }

    for (let i = shots.length - 1; i >= 0; i--) {
      if (flyShot(shots[i], dt)) shots.splice(i, 1);
    }

    blocks = blocks.filter(b =>
      (b.state !== "solved" && b.state !== "dead") || b.timer < 0.45);

    decay(dt);
  }

  // Полёт вверх мелкими шагами, чтобы быстрый снаряд не проскочил сквозь блок.
  // Возвращает true, если снаряд отработал и его пора убрать.
  function flyShot(s, dt) {
    let left = SHOT_SPEED * dt;
    while (left > 0) {
      const step = Math.min(left, 8);
      s.y -= step; left -= step;

      for (const b of blocks) {
        if (b.state === "solved" || b.state === "dead") continue;
        if (s.x < b.x || s.x > b.x + b.w) continue;
        if (s.y > b.y + b.h || s.y < b.y) continue;

        // в испорченное слово уже ничего не вставить — только снести
        if (b.broken) { miss(b, "Слово испорчено:"); return true; }

        // Пока точный прицел не включён, хватает попадания в блок: буква сама
        // встаёт в подходящий пропуск. С b.aim целиться нужно в саму ячейку.
        // Промах по букве наводки — не ошибка знания, за неё блок не портим.
        const aimed = b.aim ? cellAt(b, s.x) : -1;
        if (b.aim && (aimed === -1 || b.shown[aimed])) {
          miss(b, aimed === -1 ? "Мимо буквы:" : "Тут уже<br>есть буква:");
          return true;
        }

        const i = b.aim ? aimed : gapFor(b, s.letter);
        if (i !== -1 && acceptsAt(b, i).has(s.letter)) fill(b, i, s.letter);
        else wrongLetter(b, s.letter, i);
        return true;
      }

      if (s.y < -20) { miss(null, ""); return true; }   // ушёл в молоко
    }
    return false;
  }

  function decay(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      p.life -= dt * 2.2;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    for (let i = reveals.length - 1; i >= 0; i--) {
      reveals[i].t -= dt;
      if (reveals[i].t <= 0) reveals.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 2.5);
  }

  // ----------------------------------------------------------------- отрисовка
  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    ctx.fillStyle = "#9ead86";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (flash > 0) {
      ctx.fillStyle = "rgba(43,49,34," + (flash * .18) + ")";
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // тонкая сетка «пикселей» LCD
    ctx.strokeStyle = "rgba(43,49,34,.05)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 22) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 22) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // линия гибели
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = "rgba(43,49,34,.45)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);

    // блок на линии огня — по нему и прилетит следующая буква
    const aimed = state === "play" || state === "pause" ? blockInLine() : null;

    // сама линия огня
    if (state === "play" || state === "pause") {
      ctx.setLineDash([3, 7]);
      ctx.strokeStyle = "rgba(43,49,34,.35)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cannonX, CANNON_Y - 16);
      ctx.lineTo(cannonX, aimed ? aimed.y + aimed.h : 0);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (const b of blocks) drawBlock(b, b === aimed);
    for (const s of shots) drawShot(s);
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = INK;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    for (const r of reveals) drawReveal(r);

    drawCannon();

    if (state === "ready") drawMenu();
    if (state === "pause") banner("PAUSE", "ESC — продолжить");
    if (state === "over")  banner("GAME OVER", "ENTER — в меню");
    if (state === "win")   banner("ПОБЕДА", "все этапы пройдены");

    ctx.restore();
  }

  function drawBlock(b, isTarget) {
    const solvedNow = b.state === "solved";
    const dead = b.state === "dead";
    const t = b.timer / 0.45;

    ctx.save();
    if (solvedNow || dead) {
      ctx.globalAlpha = Math.max(0, 1 - t);
      const s = 1 + t * 0.35;
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.scale(s, s);
      ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
    }

    // корпус; hurt — вспышка от буквы, которая блоку не подошла
    ctx.fillStyle = solvedNow ? INK
                  : b.broken ? "rgba(176,58,46,.22)"
                  : b.hurt ? "rgba(43,49,34,.45)"
                  : "rgba(43,49,34,.10)";
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.lineWidth = isTarget && !solvedNow && !dead ? 3 : 1.5;
    ctx.strokeStyle = b.broken ? RED : INK;
    ctx.stroke();

    // буквы
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const step = (b.w - 26) / b.word.length;
    const startX = b.x + 13 + step / 2;
    // ячейка, в которую смотрит ствол; без точного прицела не подсвечиваем,
    // чтобы не намекать на выбор, которого у игрока пока нет
    const aimedCell = b.aim && isTarget && !solvedNow && !dead
      ? cellAt(b, cannonX) : -1;

    for (let i = 0; i < b.word.length; i++) {
      const cx = startX + i * step, cy = b.y + b.h / 2 + 1;
      const ch = solvedNow ? b.word[i] : b.shown[i];

      if (i === aimedCell && !b.shown[i]) {
        // прицел стоит на пустой ячейке — подсвечиваем именно её
        ctx.fillStyle = "rgba(43,49,34,.22)";
        ctx.fillRect(cx - step / 2 + 2, b.y + 4, step - 4, b.h - 8);
      }

      if (!ch) {
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - step / 2 + 3, cy + 11);
        ctx.lineTo(cx + step / 2 - 3, cy + 11);
        ctx.stroke();
      } else {
        // неверная буква — красным, остальные в испорченном слове приглушены
        ctx.fillStyle = solvedNow ? "#9ead86"
                      : b.wrong.has(i) ? RED
                      : b.broken ? "rgba(43,49,34,.5)"
                      : INK;
        ctx.fillText(ch.toUpperCase(), cx, cy);
      }
    }
    ctx.restore();
  }

  // Карточка с загаданным словом на месте сбитого блока: всплывает вверх и
  // гаснет. Неразгаданные буквы показаны вывернутыми — видно, чего не хватило.
  function drawReveal(r) {
    const age = 1 - r.t / REVEAL_TIME;
    const cellW = 21, padX = 13, h = 44;
    const w = padX * 2 + r.word.length * cellW;
    const x = Math.max(6, Math.min(W - 6 - w, r.x - w / 2));
    const y = Math.max(6, r.y - h / 2 - age * 34);

    ctx.save();
    const fade = REVEAL_TIME - REVEAL_HOLD;
    ctx.globalAlpha = r.t > fade ? 1 : r.t / fade;
    ctx.fillStyle = "#9ead86";
    roundRect(x, y, w, h, 6); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    roundRect(x, y, w, h, 6); ctx.stroke();

    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < r.word.length; i++) {
      const cx = x + padX + cellW * (i + 0.5), cy = y + h / 2 + 1;
      if (r.gaps.includes(i)) {
        ctx.fillStyle = INK;
        ctx.fillRect(cx - cellW / 2 + 1, y + 5, cellW - 2, h - 10);
        ctx.fillStyle = "#9ead86";
      } else {
        ctx.fillStyle = INK;
      }
      ctx.fillText(r.word[i].toUpperCase(), cx, cy);
    }
    ctx.restore();
  }

  function drawShot(s) {
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#9ead86";
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(s.letter.toUpperCase(), s.x, s.y + 1);
  }

  function drawCannon() {
    ctx.save();
    ctx.translate(cannonX, CANNON_Y);
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    ctx.lineWidth = 6;
    ctx.beginPath();                 // ствол всегда строго вверх
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -26);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fill();
    // лафет
    ctx.fillRect(-20, 6, 40, 8);
    ctx.restore();

    // итог последнего выстрела: пока летит — просто буква, потом ✓ или ✕
    if (lastKey && performance.now() - lastKeyAt < 700) {
      ctx.globalAlpha = 1 - (performance.now() - lastKeyAt) / 700;
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = INK;
      const mark = lastKeyOk === true ? " ✓" : lastKeyOk === false ? " ✕" : "";
      ctx.fillText(lastKey.toUpperCase() + mark, cannonX, CANNON_Y + 28);
      ctx.globalAlpha = 1;
    }
  }

  function drawMenu() {
    const items = menuItems();
    const top = MENU_TOP - 92;
    const bottom = MENU_TOP + items.length * MENU_STEP + 46;

    ctx.fillStyle = "rgba(158,173,134,.92)";
    ctx.fillRect(0, top, W, bottom - top);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.strokeRect(0, top, W, bottom - top);

    ctx.textAlign = "center";
    ctx.fillStyle = INK;
    ctx.font = "bold 30px 'Courier New', monospace";
    ctx.fillText(menu.screen === "root" ? "WORD SHOOTER" : "МОДИФИКАТОРЫ", W / 2, top + 44);

    for (let i = 0; i < items.length; i++) {
      const it = items[i], r = itemRect(i), on = i === menu.index;
      if (on) {
        ctx.fillStyle = INK;
        roundRect(r.x, r.y, r.w, r.h, 5);
        ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(43,49,34,.35)";
        ctx.lineWidth = 1.5;
        roundRect(r.x, r.y, r.w, r.h, 5);
        ctx.stroke();
      }
      ctx.fillStyle = on ? "#9ead86" : INK;
      ctx.font = "bold 17px 'Courier New', monospace";
      ctx.textAlign = "left";
      ctx.fillText(it.label, r.x + 16, r.y + r.h / 2 + 1);
      if (it.value) {
        ctx.textAlign = "right";
        ctx.fillText(it.value(), r.x + r.w - 16, r.y + r.h / 2 + 1);
      }
    }

    // подсказка по выбранному пункту
    ctx.textAlign = "center";
    ctx.fillStyle = INK;
    ctx.font = "12px 'Courier New', monospace";
    const hint = items[menu.index].hint;
    const lines = hint ? hint.split("<br>") : ["↑ ↓ — выбор · ENTER — применить"];
    lines.forEach((line, i) =>
      ctx.fillText(line, W / 2, MENU_TOP + items.length * MENU_STEP + 14 + i * 15));

    if (menu.open) drawDrop();
  }

  // Выпадающий список поверх меню: своя подложка, чтобы пункты под ним
  // не просвечивали и не спорили с подсветкой.
  function drawDrop() {
    const n = THEME_OPTIONS.length;
    const top = dropTop(n) - 10, height = n * DROP_STEP + 20;
    ctx.fillStyle = "#9ead86";
    ctx.fillRect((W - DROP_W) / 2 - 10, top, DROP_W + 20, height);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.strokeRect((W - DROP_W) / 2 - 10, top, DROP_W + 20, height);

    for (let i = 0; i < n; i++) {
      const id = THEME_OPTIONS[i], r = dropRect(i, n), on = i === menu.opt;
      if (on) {
        ctx.fillStyle = INK;
        roundRect(r.x, r.y, r.w, r.h, 4);
        ctx.fill();
      }
      ctx.fillStyle = on ? "#9ead86" : INK;
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.textAlign = "left";
      ctx.fillText(themeLabel(id), r.x + 14, r.y + r.h / 2 + 1);
      // размер пула: сразу видно, что «Растения» вчетверо беднее «Животных»
      ctx.textAlign = "right";
      ctx.font = "13px 'Courier New', monospace";
      ctx.fillText(id ? String(themePool(id).length) : "—", r.x + r.w - 14, r.y + r.h / 2 + 1);
      if (id === mods.theme && !on) {
        ctx.strokeStyle = "rgba(43,49,34,.45)"; ctx.lineWidth = 1.5;
        roundRect(r.x, r.y, r.w, r.h, 4);
        ctx.stroke();
      }
    }
  }

  function banner(title, sub) {
    ctx.fillStyle = "rgba(158,173,134,.86)";
    ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.strokeRect(0, H / 2 - 60, W, 120);
    ctx.fillStyle = INK;
    ctx.textAlign = "center";
    ctx.font = "bold 30px 'Courier New', monospace";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText(sub, W / 2, H / 2 + 24);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // -------------------------------------------------------------------- HUD
  function setMsg(html) { el.msg.innerHTML = html; }
  function syncHud() {
    el.score.textContent = score;
    el.level.textContent = (stage + 1) + "/" + STAGES.length;
    el.combo.textContent = "x" + Math.min(1 + Math.floor(combo / 5), 5) +
                           (combo > 1 ? " (" + combo + ")" : "");
    el.lives.textContent = "♥".repeat(Math.max(0, lives)) || "—";
    el.bombs.textContent = "◆".repeat(bombs) || "—";

    // из чего сейчас складывается сложность
    const r = rules();
    el.rules.innerHTML = `${r.name}` +
      (mods.theme ? `<br>тема: ${THEME_NAMES[mods.theme]}` : "") +
      `<br>${r.len[0]}–${r.len[1]} букв · ${r.gaps} проп.` +
      `<br>слов ${Math.min(stageSpawned, r.quota)}/${r.quota}` +
      (needsAim() ? `<br>прицел по букве` : "") +
      `<br>скорость ${Math.round(r.speed)}`;
  }

  // ---------------------------------------------------------------- ввод
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    // в меню Escape отдан навигации: он возвращает из модификаторов
    if (state === "ready") {
      if (menuKey(e)) e.preventDefault();
      return;
    }

    if (e.key === "Escape") {
      e.preventDefault();
      if (state === "play") { state = "pause"; setMsg("Пауза"); }
      else if (state === "pause") { state = "play"; setMsg(""); }
      return;
    }

    if (state === "over" || state === "win") {
      if (e.key === "Enter" || e.key === " " || resolveLetter(e)) {
        e.preventDefault();
        toMenu();
      }
      return;
    }

    if (e.key === "ArrowLeft")  { e.preventDefault(); held.left = true;  return; }
    if (e.key === "ArrowRight") { e.preventDefault(); held.right = true; return; }
    if (e.key === "Enter") { e.preventDefault(); reset(true); return; }
    if (e.key === " ") { e.preventDefault(); bombAll(); return; }

    const letter = resolveLetter(e);
    if (letter) { e.preventDefault(); shootLetter(letter); }
  });

  document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft")  held.left = false;
    if (e.key === "ArrowRight") held.right = false;
  });

  // Основное управление — мышь: пушка встаёт под курсор мгновенно, без разгона.
  // Стрелки оставлены как запасной вариант и в движении проигрывают мыши.
  const canvasPos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width),
             y: (e.clientY - r.top) * (H / r.height) };
  };

  canvas.addEventListener("pointermove", e => {
    const p = canvasPos(e);
    if (state === "ready") {                 // в меню мышь водит по пунктам
      if (menu.open) {
        const k = dropAt(p.x, p.y);
        if (k !== -1) menu.opt = k;
        return;
      }
      const i = itemAt(p.x, p.y);
      if (i !== -1) menu.index = i;
      return;
    }
    cannonX = Math.max(16, Math.min(W - 16, p.x));
    held.left = held.right = false;
  });

  // ЛКМ — точечный подрыв того блока, что стоит на линии огня
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (state === "ready") {
      const p = canvasPos(e);
      if (menu.open) {                       // клик мимо списка — закрыть
        const k = dropAt(p.x, p.y);
        if (k === -1) menu.open = null; else pickTheme(THEME_OPTIONS[k]);
        return;
      }
      const i = itemAt(p.x, p.y);
      if (i !== -1) { menu.index = i; menuItems()[i].act(); }
      return;
    }
    if (state === "over" || state === "win") { toMenu(); return; }
    if (e.button === 0) bombOne();
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  // если вкладка потеряла фокус с зажатой стрелкой, пушка не должна «залипнуть»
  window.addEventListener("blur", () => { held.left = held.right = false; });

  // Буква определяется и по e.key, и по физической клавише — чтобы играть
  // в русские слова, не переключая раскладку системы (и наоборот).
  function resolveLetter(e) {
    const key = (e.key || "").toLowerCase();
    if (key.length === 1 && ALPHABET[lang].includes(key)) return key;
    if (lang === "ru") {
      const mapped = RU_BY_CODE[e.code];
      if (mapped) return mapped;
      if (key === "ё") return "е";
    } else if (e.code && /^Key[A-Z]$/.test(e.code)) {
      return e.code.slice(3).toLowerCase();
    }
    return null;
  }

  // Язык меняется и кнопками в панели, и пунктом меню — путь один на обоих.
  // Партия при этом сбрасывается: словарь под ней меняется целиком.
  function setLang(next) {
    lang = next;
    localStorage.setItem("ws-lang", lang);
    syncLangButtons();
    const wasInMods = state === "ready" && menu.screen === "mods";
    reset();
    if (wasInMods) { menu.screen = "mods"; menu.index = 1; }
  }

  for (const btn of document.querySelectorAll(".lang button")) {
    btn.addEventListener("click", () => { setLang(btn.dataset.lang); btn.blur(); });
  }
  function syncLangButtons() {
    for (const btn of document.querySelectorAll(".lang button")) {
      btn.classList.toggle("on", btn.dataset.lang === lang);
    }
  }

  // ---------------------------------------------------------------- цикл
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);   // защита от долгих пауз вкладки
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  syncLangButtons();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
